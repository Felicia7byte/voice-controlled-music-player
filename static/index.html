<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Voice Controlled Music Player
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <div class="container">

        <h1>
            Voice Controlled Music Player
        </h1>


        <p class="description">
            Control your music player using the voice commands "play," "pause," "next track," and "previous track."
        </p>


        <!-- ============================= -->
        <!-- STATUS -->
        <!-- ============================= -->

        <div
            id="status"
            class="status"
        >
            Microphone not started
        </div>


        <!-- ============================= -->
        <!-- COMMAND -->
        <!-- ============================= -->

        <div class="command-box">

            <div class="command-title">
                Detected Command
            </div>

            <div
                id="command"
                class="command"
            >
                -
            </div>

            <div
                id="confidence"
                class="confidence"
            >
                Confidence: -
            </div>

        </div>


        <!-- ============================= -->
        <!-- MICROPHONE BUTTON -->
        <!-- ============================= -->

        <button
            id="micButton"
            class="mic-button"
        >
            🎤 Start Microphone
        </button>


        <!-- ============================= -->
        <!-- MUSIC PLAYER -->
        <!-- ============================= -->

        <div class="player">

            <h2>
                Music Player
            </h2>


            <div
                id="nowPlaying"
                class="now-playing"
            >
                No song selected
            </div>


            <audio
                id="audioPlayer"
                controls
            >
            </audio>


            <div class="manual-controls">

                <button
                    id="previousButton"
                >
                    ⏮ Previous
                </button>

                <button
                    id="playButton"
                >
                    ▶ Play
                </button>

                <button
                    id="pauseButton"
                >
                    ⏸ Pause
                </button>

                <button
                    id="nextButton"
                >
                    Next ⏭
                </button>

            </div>

        </div>


        <!-- ============================= -->
        <!-- PLAYLIST -->
        <!-- ============================= -->

        <div class="playlist">

            <h2>
                Playlist
            </h2>

            <div
                id="playlistContainer"
            >
                Loading songs...
            </div>

        </div>

    </div>


    <script src="/static/app.js"></script>

</body>

</html>
